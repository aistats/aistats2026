# Site settings
title: Artificial Intelligence and Statistics Conference
description: > # this means to ignore newlines until "baseurl:"
  This is the website of the AISTATS 2026 conference.
url: "https://aistats.org"
baseurl: "/aistats2026/" # the subpath of your site, e.g. /blog/

repository: aistats/aistats2026

# If you want to create a twitter account for your conference include
# twitter name here
twitter_username:

github_username: aistats

author:
  name: AISTATS
  # You might want to create an email for handling conference queries, e.g. aistats20XX@gmail.com. If you do, you can enter it here.
  email: aistats2026@gmail.com
comments: false

# Build settings
markdown: kramdown
plugins:
- jekyll-feed
- jekyll-seo-tag
- jekyll-remote-theme
# change encoding for the generated output files to utf-8
encoding: utf-8
remote_theme: aistats/jekyll-theme
style: aistats

ghub:
  edit: true
  repository: aistats2026

# Place a banner image in assets/images and give its name here.
banner: tangier.jpg
banner_title: Artificial Intelligence and Statistics 2026

conference:
  full_name: Artificial Intelligence and Statistics
  short_name: AISTATS
  name: Artificial Intelligence and Statistics
  # set to True if the programme is draft only.
  draft: true
  # set to True to hide tentative speakers
  hide_tentative: true
  # Place an image of venue in assets/images and give its name here
  image: tangier.jpg
  proceedings:
    # When proceedings are published add url here.
    url:
    show: false
  # Give details of the room in the venue here.
  room:
  # Set the name of the venue (e.g. Caribe Hilton Hotel)
  venue: Hilton Tangier Al Houara Resort & Spa
  # Give the url of the venue here.
  venue_url: https://virtual.aistats.org/Conferences/2026/Hotels
  # Give the conference location in the form City, Country here.
  location: Tangier, Morocco
  year: 2026
  # Give the instance of the conference here (e.g. 24th)
  instance: 29th
  # Styling for AISTATS is "International Conference"
  styling: International Conference on
  # Give the individual days that the conference will be held on here.
  # Source: https://virtual.aistats.org/Conferences/2026/Dates
  dates:
  - 2026-05-02
  - 2026-05-03
  - 2026-05-04
  - 2026-05-05
  # Give the submission site details here.
  submission:
    # Whether to show the submission site.
    show: false
    # The URL of the submission site.
    url: "https://openreview.net/group?id=aistats.org/AISTATS/2026/Conference"
    # The name of the submission site (e.g. Microsoft CMT Website)
    name: OpenReview
  # Key dates shown via {% include listdates.html %}.
  # Store parseable date/enddate/time values only — AoE is stated by the include,
  # not embedded in these strings. Clock times may use time: or text: for noon notes.
  deadlines:
    - name: Abstract submission deadline
      type: submission
      date: 25 September 2025
      important: true
    - name: Bidding phase
      type: review
      date: 29 September 2025
      enddate: 6 October 2025
    - name: Paper submission deadline
      type: submission
      date: 2 October 2025
      important: true
    - name: Supplementary material deadline
      type: submission
      date: 9 October 2025
      important: true
    - name: Workshop submission deadline
      type: submission
      date: 17 October 2025
    - name: Review period
      type: review
      date: 14 October 2025
      enddate: 10 November 2025
    - name: Reviews released to authors
      type: submission
      date: 21 November 2025
      text: 21 November 2025 (noon)
    - name: Author rebuttal period
      type: review
      date: 22 November 2025
      enddate: 8 December 2025
      important: true
    - name: Author-reviewer discussion period
      type: review
      date: 1 December 2025
      enddate: 8 December 2025
      important: true
    - name: Reviewer-AC discussion period
      type: review
      date: 9 December 2025
      enddate: 15 December 2025
    - name: AC meta reviews
      type: meta
      date: 15 December 2025
    - name: Paper decision notifications
      type: decision
      date: 22 January 2026
      important: true
    - name: Registration opens
      type: submission
      date: 20 January 2026
    - name: Journal-to-Conference track deadline
      type: submission
      date: 31 January 2026
      important: true
    - name: Financial aid application deadline
      date: 19 March 2026
    - name: Camera-ready deadline
      type: submission
      date: 31 March 2026
      important: true
    - name: Early registration pricing ends
      date: 7 April 2026
    - name: Conference dates
      type: submission
      date: 2 May 2026
      enddate: 5 May 2026
      important: true
